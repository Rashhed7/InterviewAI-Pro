<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" filter="url(#shadow)"/>
  
  <!-- Outer Glowing Orbit Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-dasharray="24 16" opacity="0.8"/>
  
  <!-- Inner AI Core Shield -->
  <path d="M 256,112 L 368,168 V 276 C 368,344 316,400 256,420 C 196,400 144,344 144,276 V 168 Z" fill="url(#primaryGrad)" stroke="#60a5fa" stroke-width="6"/>

  <!-- Glowing AI Micro-Brain / Sparkle -->
  <path d="M 256,160 L 272,216 L 328,232 L 272,248 L 256,304 L 240,248 L 184,232 L 240,216 Z" fill="url(#glowGrad)"/>
  
  <!-- Code Brackets < / > accent inside shield -->
  <path d="M 192,260 L 216,280 L 192,300" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 320,260 L 296,280 L 320,300" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Top Right Pro Star -->
  <polygon points="390,90 398,114 422,114 402,128 410,152 390,136 370,152 378,128 358,114 382,114" fill="#f59e0b"/>
</svg>